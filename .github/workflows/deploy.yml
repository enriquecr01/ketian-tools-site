name: Build & Deploy (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

# Evita despliegues encimados; si llega un push nuevo, cancela el anterior
concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build (Astro)
        run: npm run build
        # Si tu sitio necesita variables en build, agrégalas aquí:
        # env:
        #   PUBLIC_ALGO: ${{ vars.PUBLIC_ALGO }}

      - name: Deploy por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps            # usa "ftp" si tu hosting no soporta FTPS
          port: 21
          local-dir: ./dist/        # carpeta de salida de Astro (el slash final es importante)
          server-dir: ${{ secrets.FTP_SERVER_DIR }}  # ej: public_html/ o public_html/ketian/
          # Descomenta la primera vez para ver qué subiría sin tocar nada:
          # dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
